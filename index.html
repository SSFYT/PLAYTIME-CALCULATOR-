<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SSFYT - Crown Tracker Pro</title>
    <style>
        :root { --primary: #ffcc00; --bg: #0f0f0f; --card: #1a1a1a; }
        body { font-family: sans-serif; background: var(--bg); color: #fff; padding: 15px; }
        .header { text-align: center; border-bottom: 2px solid var(--primary); padding-bottom: 10px; margin-bottom: 20px; }
        .map-card { background: var(--card); padding: 15px; border-radius: 10px; margin-bottom: 15px; position: relative; border: 1px solid #333; }
        input { width: 100%; padding: 10px; margin: 8px 0; background: #252525; border: 1px solid #444; color: #fff; border-radius: 5px; box-sizing: border-box; }
        .btn { width: 100%; padding: 12px; border: none; border-radius: 5px; font-weight: bold; cursor: pointer; margin-bottom: 10px; }
        .add-btn { background: #2196F3; color: white; }
        .calc-btn { background: var(--primary); color: #000; font-size: 1.1rem; }
        .clear-btn { background: #444; color: #fff; opacity: 0.7; }
        .remove-btn { position: absolute; right: 10px; top: 10px; background: #f44336; border: none; color: white; border-radius: 50%; width: 25px; height: 25px; }
        .result-section { background: #222; padding: 20px; border-radius: 10px; text-align: center; margin-top: 20px; }
        .progress-container { width: 100%; background: #444; border-radius: 10px; height: 10px; margin: 15px 0; overflow: hidden; }
        #progress-bar { width: 0%; height: 100%; background: var(--primary); transition: 0.5s; }
        .highlight { color: var(--primary); font-size: 1.5rem; font-weight: bold; }
    </style>
</head>
<body>

    <div class="header">
        <h1>SSFYT Creator Tool</h1>
        <p>Target: 1,00,000 Playtime Hours</p>
    </div>

    <div id="map-container">
        <div class="map-card">
            <input type="text" placeholder="Map Ka Naam" class="map-name">
            <input type="number" placeholder="Total Players (30 Days)" class="players" oninput="calculate()">
            <input type="number" placeholder="Avg Playtime (Minutes)" class="avg-time" oninput="calculate()">
        </div>
    </div>

    <button class="btn add-btn" onclick="addSlot()">+ Naya Map Add Karein</button>
    <button class="btn clear-btn" onclick="clearData()">Data Clear Karein</button>

    <div class="result-section">
        <p>Aapka Total Playtime:</p>
        <span id="total-display" class="highlight">0.00</span> <span style="color:var(--primary)">Hours</span>
        
        <div class="progress-container">
            <div id="progress-bar"></div>
        </div>
        <p id="percent-text" style="font-size: 0.8rem; color: #aaa;">Progress: 0%</p>
    </div>

    <script>
        function addSlot() {
            const container = document.getElementById('map-container');
            const div = document.createElement('div');
            div.className = 'map-card';
            div.innerHTML = `
                <button class="remove-btn" onclick="this.parentElement.remove(); calculate()">×</button>
                <input type="text" placeholder="Map Ka Naam" class="map-name">
                <input type="number" placeholder="Total Players (30 Days)" class="players" oninput="calculate()">
                <input type="number" placeholder="Avg Playtime (Minutes)" class="avg-time" oninput="calculate()">
            `;
            container.appendChild(div);
        }

        function calculate() {
            const players = document.querySelectorAll('.players');
            const avgs = document.querySelectorAll('.avg-time');
            let totalMins = 0;

            players.forEach((p, index) => {
                const pVal = parseFloat(p.value) || 0;
                const aVal = parseFloat(avgs[index].value) || 0;
                totalMins += (pVal * aVal);
            });

            const totalHours = (totalMins / 60).toFixed(2);
            document.getElementById('total-display').innerText = parseFloat(totalHours).toLocaleString();

            // Progress Bar Logic
            const target = 100000;
            const percent = Math.min((totalHours / target) * 100, 100).toFixed(1);
            document.getElementById('progress-bar').style.width = percent + '%';
            document.getElementById('percent-text').innerText = `Progress: ${percent}% (Goal: 1,00,000 Hours)`;
            
            // Save to LocalStorage
            saveData();
        }

        function saveData() {
            const data = [];
            const cards = document.querySelectorAll('.map-card');
            cards.forEach(card => {
                data.push({
                    name: card.querySelector('.map-name').value,
                    p: card.querySelector('.players').value,
                    a: card.querySelector('.avg-time').value
                });
            });
            localStorage.setItem('ssfy_data', JSON.stringify(data));
        }

        function clearData() {
            if(confirm("Kya aap saara data delete karna chahte hain?")) {
                localStorage.removeItem('ssfy_data');
                location.reload();
            }
        }

        // Load data on start
        window.onload = () => {
            const saved = localStorage.getItem('ssfy_data');
            if(saved) {
                const data = JSON.parse(saved);
                document.getElementById('map-container').innerHTML = '';
                data.forEach((item, index) => {
                    const container = document.getElementById('map-container');
                    const div = document.createElement('div');
                    div.className = 'map-card';
                    div.innerHTML = `
                        ${index > 0 ? '<button class="remove-btn" onclick="this.parentElement.remove(); calculate()">×</button>' : ''}
                        <input type="text" placeholder="Map Ka Naam" class="map-name" value="${item.name}">
                        <input type="number" placeholder="Total Players (30 Days)" class="players" value="${item.p}" oninput="calculate()">
                        <input type="number" placeholder="Avg Playtime (Minutes)" class="avg-time" value="${item.a}" oninput="calculate()">
                    `;
                    container.appendChild(div);
                });
                calculate();
            }
        };
    </script>
</body>
</html>
