<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Craftland Playtime Calculator</title>
    <style>
        :root {
            --primary: #ffcc00;
            --bg: #0f0f0f;
            --card: #1e1e1e;
            --text: #ffffff;
            --success: #28a745;
        }
        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }
        .main-content {
            flex: 1;
            padding: 20px;
            width: 100%;
            max-width: 450px;
            margin: 0 auto 150px auto; /* Niche space choda hai taaki result box cover na kare */
        }
        .header { text-align: center; margin-bottom: 25px; border-bottom: 1px solid #333; padding-bottom: 10px; }
        .header h1 { color: var(--primary); margin: 0; font-size: 1.5rem; text-transform: uppercase; }
        
        .map-card {
            background: var(--card);
            padding: 15px;
            border-radius: 12px;
            margin-bottom: 20px;
            position: relative;
            border: 1px solid #333;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }
        label { display: block; font-size: 0.85rem; color: #aaa; margin-bottom: 5px; }
        input {
            width: 100%;
            padding: 12px;
            margin-bottom: 10px;
            background: #2a2a2a;
            border: 1px solid #444;
            color: #fff;
            border-radius: 8px;
            box-sizing: border-box;
            font-size: 1rem;
            outline: none;
        }
        input:focus { border-color: var(--primary); }

        .btn {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            margin-bottom: 15px;
            font-size: 1rem;
            transition: 0.3s;
        }
        .add-btn { background: #007bff; color: white; margin-top: 10px; }
        
        .remove-btn {
            position: absolute;
            top: -10px;
            right: -10px;
            background: #dc3545;
            color: white;
            border: 2px solid var(--bg);
            width: 28px;
            height: 28px;
            border-radius: 50%;
            cursor: pointer;
            font-weight: bold;
            z-index: 5;
        }

        /* Fixed Result Box at the Bottom */
        .result-box {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: #252525;
            padding: 15px 20px;
            border-top: 3px solid var(--primary);
            box-shadow: 0 -5px 15px rgba(0,0,0,0.5);
            z-index: 100;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .total-container { width: 100%; max-width: 450px; text-align: center; }
        .total-val { font-size: 1.8rem; font-weight: bold; color: var(--primary); line-height: 1; }
        
        .tier-status {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 5px;
            width: 100%;
            margin-top: 10px;
            background: #111;
            padding: 8px;
            border-radius: 8px;
        }
        .tier-item {
            font-size: 0.7rem;
            color: #666;
            display: flex;
            justify-content: space-between;
            padding: 2px 5px;
            border-right: 1px solid #222;
        }
        .tier-item:nth-child(2n) { border-right: none; }
        .tier-item.achieved { color: var(--success); font-weight: bold; }
    </style>
</head>
<body>

<div class="main-content">
    <div class="header">
        <h1>SSFYT Creator Tool</h1>
    </div>

    <div id="map-container">
        <div class="map-card">
            <label>Total Players (Last 30 Days)</label>
            <input type="number" class="players" placeholder="0" oninput="calculate()">
            <label>Avg Playtime (Minutes)</label>
            <input type="number" class="avg-time" placeholder="0" step="0.1" oninput="calculate()">
        </div>
    </div>

    <button class="btn add-btn" onclick="addSlot()">+ Add More Map Slot</button>
</div>

<div class="result-box">
    <div class="total-container">
        <div style="font-size: 0.8rem; color: #bbb;">Total Playtime Hours</div>
        <div id="total-hours" class="total-val">0.00</div>
        
        <div class="tier-status">
            <div class="tier-item" id="tier-dawn">Dawn: <span>✕</span></div>
            <div class="tier-item" id="tier-rising">Rising: <span>✕</span></div>
            <div class="tier-item" id="tier-favourite">Fav: <span>✕</span></div>
            <div class="tier-item" id="tier-crown">Crown: <span>✕</span></div>
        </div>
    </div>
</div>

<script>
    function addSlot() {
        const container = document.getElementById('map-container');
        const div = document.createElement('div');
        div.className = 'map-card';
        div.innerHTML = `
            <button class="remove-btn" onclick="this.parentElement.remove(); calculate()">×</button>
            <label>Total Players</label>
            <input type="number" class="players" placeholder="0" oninput="calculate()">
            <label>Avg Playtime</label>
            <input type="number" class="avg-time" placeholder="0" step="0.1" oninput="calculate()">
        `;
        container.appendChild(div);
    }

    function calculate() {
        const players = document.querySelectorAll('.players');
        const avgs = document.querySelectorAll('.avg-time');
        let totalMins = 0;

        players.forEach((p, i) => {
            const pVal = parseFloat(p.value) || 0;
            const aVal = parseFloat(avgs[i].value) || 0;
            totalMins += (pVal * aVal);
        });

        const totalHours = (totalMins / 60);
        document.getElementById('total-hours').innerText = totalHours.toLocaleString(undefined, {minimumFractionDigits: 2, maximumFractionDigits: 2});

        updateTiers(totalHours);
    }

    function updateTiers(hours) {
        const tiers = [
            { id: 'tier-dawn', val: 5000 },
            { id: 'tier-rising', val: 15000 },
            { id: 'tier-favourite', val: 45000 },
            { id: 'tier-crown', val: 100000 }
        ];

        tiers.forEach(tier => {
            const el = document.getElementById(tier.id);
            const span = el.querySelector('span');
            if (hours >= tier.val) {
                el.classList.add('achieved');
                span.innerText = '✓';
            } else {
                el.classList.remove('achieved');
                span.innerText = '✕';
            }
        });
    }
</script>

</body>
</html>
