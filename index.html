<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Craftland Playtime Calculator</title>
    <style>
        :root {
            --primary: #ffcc00;
            --bg: #0f0f0f;
            --card: #1e1e1e;
            --text: #ffffff;
            --success: #28a745;
        }
        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .container { width: 100%; max-width: 450px; }
        .header { text-align: center; margin-bottom: 25px; border-bottom: 1px solid #333; padding-bottom: 10px; }
        .header h1 { color: var(--primary); margin: 0; font-size: 1.5rem; text-transform: uppercase; }
        .map-card {
            background: var(--card);
            padding: 15px;
            border-radius: 12px;
            margin-bottom: 15px;
            position: relative;
            border: 1px solid #333;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }
        label { display: block; font-size: 0.85rem; color: #aaa; margin-bottom: 5px; }
        input {
            width: 100%;
            padding: 12px;
            margin-bottom: 10px;
            background: #2a2a2a;
            border: 1px solid #444;
            color: #fff;
            border-radius: 8px;
            box-sizing: border-box;
            font-size: 1rem;
            outline: none;
        }
        input:focus { border-color: var(--primary); }
        .btn {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            margin-bottom: 15px;
            font-size: 1rem;
            transition: 0.3s;
        }
        .add-btn { background: #007bff; color: white; }
        .add-btn:hover { background: #0056b3; }
        .remove-btn {
            position: absolute;
            top: -10px;
            right: -10px;
            background: #dc3545;
            color: white;
            border: 2px solid var(--bg);
            width: 28px;
            height: 28px;
            border-radius: 50%;
            cursor: pointer;
            font-weight: bold;
        }
        .result-box {
            background: #252525;
            padding: 20px;
            border-radius: 12px;
            text-align: center;
            border: 2px solid var(--primary);
            margin-top: 10px;
            position: sticky;
            bottom: 20px;
        }
        .total-val { font-size: 2.2rem; font-weight: bold; color: var(--primary); }
        .tier-status {
            margin-top: 15px;
            text-align: left;
            background: #111;
            padding: 10px;
            border-radius: 8px;
        }
        .tier-item {
            padding: 8px 0;
            font-size: 0.9rem;
            display: flex;
            justify-content: space-between;
            color: #666;
            border-bottom: 1px solid #222;
        }
        .tier-item:last-child { border: none; }
        .tier-item.achieved { color: var(--success); font-weight: bold; }
        .tier-item.achieved span::after { content: ' ✅'; }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h1>SSFYT Creator Tool</h1>
    </div>

    <div id="map-container">
        <div class="map-card">
            <label>Total Players (Last 30 Days)</label>
            <input type="number" class="players" placeholder="0" oninput="calculate()">
            <label>Avg Playtime (Minutes)</label>
            <input type="number" class="avg-time" placeholder="0" step="0.1" oninput="calculate()">
        </div>
    </div>

    <button class="btn add-btn" onclick="addSlot()">+ Add Another Map Slot</button>

    <div class="result-box">
        <div style="font-size: 0.9rem; color: #bbb; margin-bottom: 5px;">Total Playtime (Hours)</div>
        <div id="total-hours" class="total-val">0.00</div>
        
        <div class="tier-status">
            <div class="tier-item" id="tier-dawn">Dawn (5,000 hrs) <span>Pending</span></div>
            <div class="tier-item" id="tier-rising">Rising (15,000 hrs) <span>Pending</span></div>
            <div class="tier-item" id="tier-favourite">Favourite (45,000 hrs) <span>Pending</span></div>
            <div class="tier-item" id="tier-crown">Crown (1,00,000 hrs) <span>Pending</span></div>
        </div>
    </div>
</div>

<script>
    function addSlot() {
        const container = document.getElementById('map-container');
        const div = document.createElement('div');
        div.className = 'map-card';
        div.innerHTML = `
            <button class="remove-btn" onclick="this.parentElement.remove(); calculate()">×</button>
            <label>Total Players (Last 30 Days)</label>
            <input type="number" class="players" placeholder="0" oninput="calculate()">
            <label>Avg Playtime (Minutes)</label>
            <input type="number" class="avg-time" placeholder="0" step="0.1" oninput="calculate()">
        `;
        container.appendChild(div);
    }

    function calculate() {
        const players = document.querySelectorAll('.players');
        const avgs = document.querySelectorAll('.avg-time');
        let totalMins = 0;

        players.forEach((p, i) => {
            const pVal = parseFloat(p.value) || 0;
            const aVal = parseFloat(avgs[i].value) || 0;
            totalMins += (pVal * aVal);
        });

        const totalHours = (totalMins / 60);
        document.getElementById('total-hours').innerText = totalHours.toLocaleString(undefined, {minimumFractionDigits: 2, maximumFractionDigits: 2});

        updateTiers(totalHours);
    }

    function updateTiers(hours) {
        const tiers = [
            { id: 'tier-dawn', val: 5000 },
            { id: 'tier-rising', val: 15000 },
            { id: 'tier-favourite', val: 45000 },
            { id: 'tier-crown', val: 100000 }
        ];

        tiers.forEach(tier => {
            const el = document.getElementById(tier.id);
            if (hours >= tier.val) {
                el.classList.add('achieved');
                el.querySelector('span').innerText = 'Completed';
            } else {
                el.classList.remove('achieved');
                el.querySelector('span').innerText = 'Pending';
            }
        });
    }
</script>

</body>
</html>
